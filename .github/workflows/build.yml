name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Prepare 
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> $GITHUB_ENV
          sudo rm /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

      - name: Build Kernel
        run: |
             curl -LSs "https://raw.githubusercontent.com/agni-prjkt/KernelSU-Next/susfs/kernel/setup.sh" | bash -s susfs
             bash build.sh
           
