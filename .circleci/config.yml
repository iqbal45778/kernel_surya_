version: 2.1
jobs:
  compile:
   docker:
      - image: ghcr.io/neutron-toolchains/docker-image:arch-neutron
   steps:
      - run:
          no_output_timeout: 50m
          command: |
           git clone https://github.com/rinnsakaguchi/pandora-kernel -b 13 kernel 
           cd kernel
           git clone https://github.com/rinnsakaguchi/myscripts -b master
           mkdir clang && curl https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz -RLO && tar -C clang/ -xf clang-r536225.tar.gz
           git clone https://github.com/greenforce-project/gcc-arm64 -b main --depth=1 gcc
           git clone https://github.com/greenforce-project/gcc-arm -b main --depth=1 gcc32
           chmod +x myscripts/surya_ksu.sh
           ./myscripts/surya_ksu.sh
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
